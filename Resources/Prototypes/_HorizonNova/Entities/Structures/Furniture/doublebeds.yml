# Порт с lust-station: Resources/Prototypes/_Sunrise/Entities/Structures/Furniture/doublebeds.yml
# Адаптировано под Lua: parent Bed, взамен отсутствующего поля buckleOffsets используется
# компонент DoubleStrap этой сборки. Способность сна даёт HealOnBuckle (SharedBedSystem).

- type: entity
  parent: Bed
  id: DoubleBed
  name: double bed
  description: This is used to lie in, sleep in or strap on. Resting here provides extremely slow healing.
  components:
  - type: Sprite
    sprite: _HorizonNova/Entities/Structures/Furniture/doublebeds.rsi
    state: doublebed
    noRot: true
    drawdepth: HighFloorObjects
  - type: Construction
    graph: DoubleBeds
    node: doubleBed
  - type: Transform
    noRot: true
  - type: Strap
    position: Down
    rotation: -90
    size: 200
  - type: DoubleStrap
    slots:
    - "0,-0.15"
    - "0,0.25"
