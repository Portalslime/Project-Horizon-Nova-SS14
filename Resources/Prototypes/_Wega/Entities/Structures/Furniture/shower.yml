- type: entity
  id: Shower
  name: shower
  description: "Caution: wet floor and wet people. Not designed for firefighting or escaping security guards."
  placement:
    mode: SnapgridCenter
  components:
  - type: Clickable
  - type: InteractionOutline
  - type: Physics
    bodyType: Static
    canCollide: False
  - type: Sprite
    noRot: true
    sprite: _Wega/Structures/Furniture/shower.rsi
    layers:
    - state: shower
    - state: water
      map: ["enum.ShowerVisuals.Spraying"]
      visible: false
  - type: Shower
  - type: AmbientSound
    enabled: false
    range: 5
    sound:
      collection: Shower
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 400
      behaviors:
        - !type:DoActsBehavior
          acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
  - type: SolutionContainerManager
    solutions:
      shower:
        maxVol: 100
  # Horizon: fed from the plumbing supply line, so it sprays whatever liquid the pipes carry.
  - type: Transform
    anchored: true
  - type: Anchorable
  - type: NodeContainer
    nodes:
      plumbing:
        !type:PlumbingNode
        nodeGroupID: Plumbing
        portable: true
        volume: 10
  - type: PlumbingOutlet
    solution: shower
    rate: 40
  - type: DumpableSolution
    solution: shower
  - type: Construction
    graph: ShowerGraph
    node: shower
  - type: Appearance
