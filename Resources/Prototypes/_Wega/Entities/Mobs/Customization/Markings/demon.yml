# Раса Аркана (Demon): черты внешности, перенесённые из сборки wega
#
# Порт с wega-team/ss14-wega:
#   Resources/Prototypes/_Wega/Entities/Mobs/Customization/Markings/demon.yml
#   Resources/Prototypes/_Wega/Entities/Mobs/Customization/Markings/demon_tails.yml
#   Resources/Prototypes/_Wega/Entities/Mobs/Customization/Markings/demon_ears.yml
#   Resources/Prototypes/_Wega/Entities/Mobs/Customization/Markings/demon_breasts.yml
# Адаптировано под LuaGitMy: groupWhitelist -> speciesRestriction, bodyPart -> markingCategory,
# все «телесные» оверлеи отображаются на слое Chest (как у HumanBreast* в _HorizonNova),
# анимированные хвосты ограничены расой (пустой speciesRestriction делал их невидимыми).
#
# Спрайты: Resources/Textures/_Wega/Mobs/Customization/
#   demon.rsi        — CC-BY-SA-3.0, created by discord:lunalita, recoloring by melissandravov
#   demon_lava.rsi   — CC-BY-SA-3.0, Skyrat-tg, wagging tail by SonicDC
#   demon_breasts.rsi — CC-BY-SA-3.0, made by Melissandra

# Хвосты
- type: marking
  id: DemomTail
  bodyPart: Tail
  markingCategory: Tail
  speciesRestriction: [Demon]
  coloring:
    default:
      type:
        !type:SkinColoring
  sprites:
  - sprite: _Wega/Mobs/Customization/demon.rsi
    state: tail

- type: marking
  id: DemomTailAnimated
  bodyPart: Tail
  markingCategory: Tail
  speciesRestriction: [Demon]
  coloring:
    default:
      type:
        !type:SkinColoring
  sprites:
  - sprite: _Wega/Mobs/Customization/demon.rsi
    state: tail_waggin

- type: marking
  id: DemonDrakeTile
  bodyPart: Tail
  markingCategory: Tail
  speciesRestriction: [Demon]
  coloring:
    default:
      type:
        !type:SkinColoring
    layers:
      tail_drake_secondary:
        type:
          !type:EyeColoring
  sprites:
  - sprite: _Wega/Mobs/Customization/demon_lava.rsi
    state: tail_drake
  - sprite: _Wega/Mobs/Customization/demon_lava.rsi
    state: tail_drake_secondary

- type: marking
  id: DemonDrakeTileAnimated
  bodyPart: Tail
  markingCategory: Tail
  speciesRestriction: [Demon]
  coloring:
    default:
      type:
        !type:SkinColoring
    layers:
      tail_drake_wagging_secondary:
        type:
          !type:EyeColoring
  sprites:
  - sprite: _Wega/Mobs/Customization/demon_lava.rsi
    state: tail_drake_wagging
  - sprite: _Wega/Mobs/Customization/demon_lava.rsi
    state: tail_drake_wagging_secondary

