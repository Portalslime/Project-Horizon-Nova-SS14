- type: gameMap
  id: Frontier
  mapName: 'Сектор Фронтир'
  mapPath: /Maps/_ZS/Hotizont_Point.yml.yml
  isGrid: true # Horizont Point is a plain grid, not a map
  minPlayers: 0
  maxPlayers: 100
  randomRotation: false
  maxRandomOffset: 0
  stations:
    Frontier:
      stationProto: StandardFrontierStation
      # Lua add start
      gridComponents:
      - type: VesselMusic
        ambientMusicPrototype: ColossusCentralMusic
      - type: VesselInfo
        description: "Хотя бы здесь вы можете почувствовать себя в безопасности."
      # Lua add end
      components:
        - type: FrontierParking # Lua
        - type: RadarBlipIcon
          icon: /Textures/_Lua/Interface/Radar/space-station.png
          scale: 1.2
          allowWhenHidden: true
        - type: StationNameSetup
          mapNameTemplate: 'Станция Фронтир'
#          nameGenerator:
#            !type:NanotrasenNameGenerator
#            prefixCreator: '14'
        - type: ExtraStationInformation
          iconPath: /Textures/Structures/Decoration/banner.rsi/banner.png # used the biggest one, looks better when downscaling than upscaling
          stationSubtext: 'frontier-lobby-frontier-subtext'
          stationDescription: 'frontier-lobby-frontier-description'
          lobbySortOrder: 1
        - type: StationJobs
          availableJobs:
            Pilot: [ -1, -1 ]
