- type: entity
  id: MusicBasePDA
  abstract: true
  components:
  - type: Instrument
    allowPercussion: true
    allowProgramChange: true
    respectMidiLimits: false
    handheld: true

- type: entity
  parent: [MusicBasePDA, AdminPDA]
  id: NFAdminPDA
  components:
  - type: CartridgeLoader
    diskSpace: 20
    preinstalled:
      - CrewManifestCartridge
      - NotekeeperCartridge
      - YupiTransferCartridge # Lua
      - NanoChatCartridge # Lua
      - NanoTaskCartridge
      - NewsReaderCartridge
      - BountyContractsCartridge
      - AstroNavCartridge
      - WantedListCartridge
      - LogProbeCartridge
      - MailMetricsCartridge
      - AppraisalCartridge
      - NetProbeCartridge

- type: entity
  parent: BasePDA
  id: PilotPDA
  name: pilot PDA
  description: This PDA smells like thruster exhaust fumes.
  components:
  - type: Pda
    id: PilotIDCard
  - type: Appearance
    appearanceDataInit:
      enum.PdaVisuals.PdaType:
        !type:String
        pda-pilot
  - type: PdaBorderColor
    borderColor: "#717059"
    accentVColor: "#A32D26"
  - type: Icon
    state: pda-pilot
