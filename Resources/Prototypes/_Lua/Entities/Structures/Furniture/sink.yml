- type: entity
  name: wide sink
  id: SinkWideEmpty
  parent: SinkEmpty
  suffix: Empty
  components:
  - type: Sprite
    sprite: Structures/Furniture/sink.rsi
    layers:
      # Horizon: the supply pipe sticks out of the sink on its south side.
      - sprite: _Horizon/Structures/Plumbing/pipe.rsi
        state: pipeHalf
        color: "#8a5a2b"
      - state: sink_wide
      - map: [ "enum.SolutionContainerLayers.Fill" ]
        state: sink_wide-fill-1
        visible: false
  - type: SolutionContainerVisuals
    maxFillLevels: 1
    fillBaseName: sink_wide-fill-
    solutionName: drainBuffer
  - type: Construction
    graph: SinkGraph
    node: SinkWideNode

- type: entity
  name: wide sink
  id: SinkWide
  parent: SinkWideEmpty
  suffix: Water
  # Horizon: no starting water, sinks are filled through the plumbing supply line.
  components:
  - type: SolutionContainerManager
    solutions:
      drainBuffer:
        maxVol: 200
