- type: constructionGraph
  id: PlumbingPipe
  start: start
  graph:
  - node: start
    edges:
    - to: half
      steps:
      - material: Plastic
        amount: 1
        doAfter: 1
    - to: straight
      steps:
      - material: Plastic
        amount: 1
        doAfter: 1
    - to: bend
      steps:
      - material: Plastic
        amount: 1
        doAfter: 1
