# Liquid plumbing pipes. They reuse the gas pipe sprites with a tint until dedicated art exists.
# Note: the PlumbingNode direction is the south-facing (unrotated) one, like for gas pipes.

- type: entity
  abstract: true
  parent: [ RecyclableItemSteelSmall, BaseItem ]
  id: PlumbingPipeBase
  name: plumbing pipe
  description: Carries liquids.
  placement:
    mode: SnapgridCenter
  components:
  - type: Item
    size: Normal
  - type: Transform
    anchored: true
  - type: Damageable
    damageContainer: StructuralInorganic
    damageModifierSet: Metallic
  - type: SubFloorHide
  - type: CollideOnAnchor
  - type: Anchorable
  - type: Rotatable
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
          params:
            volume: -8
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: Sprite
    sprite: _Horizon/Structures/Plumbing/pipe.rsi
    # Drawn underneath the gas pipes.
    drawdepth: ThickPipe
    color: "#8a5a2b"
  - type: NodeContainer
  # Two pieces can't be anchored together if they open in the same direction.
  - type: PlumbingRestrictOverlap
  - type: Physics
    canCollide: false
    bodyType: static
  - type: StaticPrice
    price: 12
  - type: EmitSoundOnPickup
    sound:
      path: /Audio/_Goobstation/Items/handling/wrench_pickup.ogg
      params:
        volume: -2
  - type: EmitSoundOnDrop
    sound:
      path: /Audio/Items/wrench_drop.ogg
      params:
        volume: -2
  - type: EmitSoundOnLand
    sound:
      collection: PipeDrop

- type: entity
  parent: PlumbingPipeBase
  id: PlumbingPipeHalf
  suffix: Half
  components:
  - type: NodeContainer
    nodes:
      plumbing:
        !type:PlumbingNode
        nodeGroupID: Plumbing
        pipeDirection: South
        volume: 25
  - type: Sprite
    layers:
    - state: pipeHalf
  - type: Construction
    graph: PlumbingPipe
    node: half
  - type: Item
    size: Small

- type: entity
