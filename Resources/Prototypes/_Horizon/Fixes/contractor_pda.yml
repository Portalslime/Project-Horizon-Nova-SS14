# Restored from before commit 1ec3e852ea ("only the pilot role is left"): several prototypes still
# reference ContractorPDA (loadouts, chameleon default), and a missing entity made the client crash
# in the admin spawn menu when it built a preview of a mob that equips it.
- type: entity
  parent: PassengerPDA
  id: ContractorPDA
  name: contractor PDA
  categories: [ HideSpawnMenu ]
  components:
  - type: Appearance
    appearanceDataInit:
      enum.PdaVisuals.PdaType:
        !type:String
        pda
