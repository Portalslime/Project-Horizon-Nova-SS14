# A trough for animals, filled from the plumbing network. Animals drink from it on their own, buckets can fill and
# empty it. The sprite (trough.rsi) is a copy of the sink for now, a PLACEHOLDER.
- type: entity
  name: animal trough
  id: AnimalTrough
  description: Animals drink from it. Connect it to the water pipes or fill it by hand.
  placement:
    mode: SnapgridCenter
  components:
  - type: Clickable
  - type: InteractionOutline
  # Has to be anchored to join the plumbing network, an unanchored node never connects.
  - type: Transform
    anchored: true
  - type: Anchorable
  - type: Sprite
    sprite: _Horizon/Objects/Husbandry/trough.rsi
    layers:
      - state: trough
      - map: [ "enum.SolutionContainerLayers.Fill" ]
        state: trough-fill-1
        visible: false
  - type: Appearance
  - type: SolutionContainerVisuals
    maxFillLevels: 1
    fillBaseName: trough-fill-
    solutionName: tank
  - type: SolutionContainerManager
    solutions:
      tank:
        maxVol: 100
  - type: NodeContainer
    nodes:
      plumbing:
        !type:PlumbingNode
        nodeGroupID: Plumbing
        portable: true
        volume: 10
  - type: PlumbingOutlet
    solution: tank
  - type: WaterSource
    solution: tank
    amountPerDrink: 15
    hydrationPerUnit: 1
    delay: 2
    drinkSound:
      path: /Audio/Items/drink.ogg
  - type: DrainableSolution
    solution: tank
  - type: RefillableSolution
    solution: tank
  - type: Damageable
    damageContainer: Inorganic
    damageModifierSet: Metallic
  - type: Destructible
    thresholds:
      - trigger:
          !type:DamageTrigger
          damage: 60
        behaviors:
          - !type:DoActsBehavior
            acts: [ "Destruction" ]
          - !type:PlaySoundBehavior
            sound:
              collection: MetalBreak
  - type: Construction
    graph: AnimalTroughGraph
    node: AnimalTroughNode

- type: constructionGraph
  id: AnimalTroughGraph
  start: start
  graph:
  - node: start
    edges:
    - to: AnimalTroughNode
      steps:
      - material: Steel
        amount: 5
        doAfter: 3

  - node: AnimalTroughNode
    entity: AnimalTrough
    edges:
    - to: start
      completed:
      - !type:SpawnPrototype
        prototype: SheetSteel1
        amount: 5
      - !type:DeleteEntity
      steps:
      - tool: Welding
        doAfter: 3

- type: construction
  id: AnimalTroughConstruction
  graph: AnimalTroughGraph
  startNode: start
  targetNode: AnimalTroughNode
  category: construction-category-plumbing
  objectType: Structure
  placementMode: SnapgridCenter
  canBuildInImpassable: false
