# HorseNeigh (a cow) and HorseFootstep (wood) are PLACEHOLDERS, there are no real recordings for them in the repository yet.
# HorseEat is real, see Resources/Audio/_Horizon/Animals/attributions.yml. Replace the placeholder files (and describe the
# new ones in the same attributions.yml) and nothing else has to change.
# Take CC0 recordings or your own only: CC-BY and the like want the author named in the credits of the game.
# Raw recordings are cut and encoded with Tools/_Horizon/audio/prepare_sfx.py.
