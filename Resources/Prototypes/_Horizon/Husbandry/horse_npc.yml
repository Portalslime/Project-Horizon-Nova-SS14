# A horse looks for food and water before it gets desperate, unlike the usual FoodCompound.
# Reaching the target, eating and drinking are done by the Husbandry operators.
- type: htnCompound
  id: HorseCompound
  branches:
    # Food
    - tasks:
        - !type:HTNPrimitiveTask
          preconditions:
            - !type:NeedPrecondition
              need: Satiety
          operator: !type:FindFoodOperator

        - !type:HTNPrimitiveTask
          operator: !type:MoveToOperator
            pathfindInPlanning: true
            removeKeyOnFinish: false
            targetKey: TargetCoordinates
            pathfindKey: TargetPathfind
            rangeKey: MeleeRange

        - !type:HTNPrimitiveTask
          preconditions:
            - !type:KeyExistsPrecondition
              key: Target
          operator: !type:AnimalEatOperator

        - !type:HTNPrimitiveTask
          preconditions:
            - !type:KeyExistsPrecondition
              key: IdleTime
          operator: !type:WaitOperator
            key: IdleTime

    # Water
    - tasks:
        - !type:HTNPrimitiveTask
          preconditions:
            - !type:NeedPrecondition
              need: Hydration
          operator: !type:FindWaterOperator

        - !type:HTNPrimitiveTask
          operator: !type:MoveToOperator
            pathfindInPlanning: true
            removeKeyOnFinish: false
            targetKey: TargetCoordinates
            pathfindKey: TargetPathfind
            rangeKey: MeleeRange

        - !type:HTNPrimitiveTask
          preconditions:
            - !type:KeyExistsPrecondition
              key: Target
          operator: !type:AnimalDrinkOperator

        - !type:HTNPrimitiveTask
          preconditions:
            - !type:KeyExistsPrecondition
              key: IdleTime
          operator: !type:WaitOperator
            key: IdleTime

    - tasks:
        - !type:HTNCompoundTask
          task: IdleCompound
