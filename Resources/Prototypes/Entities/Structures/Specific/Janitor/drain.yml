- type: entity
  id: FloorDrain
  name: drain
  description: Drains puddles around it. Useful for dumping mop buckets or keeping certain rooms clean.
  placement:
    mode: SnapgridCenter
  components:
    - type: Sprite
      drawdepth: FloorObjects
      sprite: Objects/Specific/Janitorial/drain.rsi
      layers:
      # Horizon: the sewage pipe sticks out of the drain on its south side.
      - sprite: _Horizon/Structures/Plumbing/pipe.rsi
        state: pipeHalf
        color: "#8a5a2b"
      - state: icon
      - map: [ "enum.SolutionContainerLayers.Fill" ]
        state: fill-1
        visible: false
    - type: InteractionOutline
    - type: Clickable
    - type: Transform
      anchored: true
    - type: Physics
      bodyType: Static
      canCollide: false
    - type: AmbientSound
      enabled: false
      volume: -8
      range: 8
      sound:
        path: /Audio/Ambience/Objects/drain.ogg
    # Horizon: the drain no longer destroys what it collects, it sends it into the sewage pipes.
    # If they are full or missing it backs up (and can be plunged) instead of spilling again.
    - type: Drain
      unitsDestroyedPerSecond: 0
    - type: NodeContainer
      nodes:
        plumbing:
          !type:PlumbingNode
          nodeGroupID: Plumbing
          pipeDirection: South
          rotationsEnabled: false # the sprite does not rotate
          volume: 10
    - type: PlumbingInlet
      rate: 30
      spillWhenBlocked: false
    - type: DumpableSolution
      solution: drainBuffer
    - type: Appearance
    - type: SolutionContainerVisuals
      maxFillLevels: 1
      fillBaseName: fill-
      solutionName: drainBuffer
    - type: SolutionContainerManager
      solutions:
        drainBuffer:
          maxVol: 200
    - type: DrainableSolution
      solution: drainBuffer
    - type: Damageable
      damageContainer: StructuralInorganic
      damageModifierSet: StructuralMetallic
    - type: Destructible
      thresholds:
        - trigger:
            !type:DamageTrigger
            damage: 200
          behaviors:
            - !type:DoActsBehavior
              acts: [ "Destruction" ]
        - trigger:
            !type:DamageTrigger
            damage: 100
          behaviors:
            - !type:DoActsBehavior
              acts: [ "Destruction" ]
            - !type:PlaySoundBehavior
              sound:
                collection: MetalBreak
    - type: Construction
      graph: FloorDrain
      node: FloorDrain
