- type: entity
  name: toilet
  id: BaseToilet
  # Horizon: no longer a disposal unit (and no longer powered). It is flushed into the sewage pipes.
  parent: [ BaseMachine, SeatBase ]
  description: The HT-451, a torque rotation-based waste unit. Flush it into the sewage pipes. This one seems remarkably clean.
  abstract: true
  components:
  - type: Sprite
    sprite: Structures/Furniture/toilet.rsi
    layers:
    - state: disposal
      map: [ "enum.DisposalUnitVisualLayers.Base" ]
    - map: [ "ToolOpenableVisualState.StashOpen" ] # Frontier
    - map: [ "DoorVisualState.DoorOpen" ]
    - map: [ "SeatVisualState.SeatUp" ]
  - type: Rotatable
  - type: Transform
    noRot: false
  - type: Strap
    whitelist:
      components:
      - HumanoidAppearance
  - type: Toilet
  # Only a drain: the toilet buffer is sent into the sewage pipes when it is flushed. Anyone sitting on it who
  # relieves themselves fills the buffer instead of leaving an item, and it spills over when it is full.
  - type: NodeContainer
    nodes:
      plumbing:
        !type:PlumbingNode
        nodeGroupID: Plumbing
        portable: true
        volume: 10
  - type: Flushable
  # If the pipes are full and being pushed into, the toilet overflows onto the floor to make room.
  - type: PlumbingOverflow
  - type: DefecationSeat
  - type: ContainerContainer
    containers:
      stash: !type:ContainerSlot {}
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeCircle
          radius: 0.4
        density: 190
        mask:
        - MachineMask
        layer:
        - None
  - type: PlungerUse
  - type: Appearance
  - type: SecretStash
    secretStashName: secret-stash-toilet
  - type: ToolOpenable
    openToolQualityNeeded: Prying
    closeToolQualityNeeded: Prying
    name: secret-stash-toilet
  - type: Drain
    autoDrain: false
    unitsDestroyedPerSecond: 0
  - type: StaticPrice
    price: 30 # Frontier: 100<30
  - type: RatKingRummageable
  - type: SolutionContainerManager
    solutions:
      drainBuffer:
        maxVol: 50
      tank:
        maxVol: 5
  - type: DrainableSolution
    solution: tank
  - type: ReagentTank
  - type: DumpableSolution
    solution: drainBuffer
  - type: GenericVisualizer
    visuals:
      enum.ToiletVisuals.SeatVisualState:
        SeatVisualState.SeatUp:
          SeatUp: { state: disposal-up }
          SeatDown: { state: disposal-down }
      enum.ToolOpenableVisuals.ToolOpenableVisualState:
        ToolOpenableVisualState.StashOpen:
          Open: { state: disposal-open }
          Closed: { state: disposal-closed }

- type: entity
  name: toilet
  description: The HT-451, a torque rotation-based waste unit. Flush it into the sewage pipes. This one seems remarkably clean.
  id: ToiletEmpty
  parent: BaseToilet
  suffix: Empty
  components:
  - type: Construction
    graph: Toilet
    node: toilet

- type: entity
  id: ToiletDirtyWater
  parent: ToiletEmpty
  suffix: Dirty Water
  components:
  - type: SolutionContainerManager
    solutions:
      drainBuffer:
        maxVol: 50
      tank:
        maxVol: 5
        reagents:
        - ReagentId: AntiSepticFluid # Frontier: Water<AntiSepticFluid
          Quantity: 2
        - ReagentId: GastroToxin
          Quantity: 3
  - type: Toilet # Frontier
    clogProbability: 0.3 # Frontier

- type: entity
  id: ToiletGoldenEmpty
  parent: BaseToilet
  name: golden toilet
  description: The HT-451G is the gold version of the device. It says on the side that it is made of the purest Mercurian gold and a real leather seat.
  suffix: Empty
  components:
  - type: Sprite
    sprite: Structures/Furniture/golden_toilet.rsi
  - type: StaticPrice
    price: 1500
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 200
      behaviors:
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
          params:
            volume: -6
      - !type:SpawnEntitiesBehavior
        spawn:
          IngotGold1:
            min: 5
            max: 5

- type: entity
  id: ToiletGoldenDirtyWater
  parent: ToiletGoldenEmpty
  suffix: Dirty Water, StealTarget
  components:
  - type: StealTarget
    stealGroup: ToiletGoldenDirtyWater
  - type: SolutionContainerManager
    solutions:
      drainBuffer:
        maxVol: 50
      tank:
        maxVol: 5
        reagents:
        - ReagentId: AntiSepticFluid # Frontier: Water<AntiSepticFluid
          Quantity: 1
        - ReagentId: Gold
          Quantity: 1
        - ReagentId: GastroToxin
          Quantity: 2
  - type: Toilet # Frontier
    clogProbability: 0.3 # Frontier
